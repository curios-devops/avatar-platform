version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # ── Cloudflare R2 ──────────────────────────────────────────────────────
      # Copy from .env.example and fill in your R2 credentials.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-avatar-platform}
      S3_REGION: ${S3_REGION:-auto}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}

      # ── RunPod ─────────────────────────────────────────────────────────────
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_FLAME_ENDPOINT_ID: ${RUNPOD_FLAME_ENDPOINT_ID:-}
      RUNPOD_RECONSTRUCT_ENDPOINT_ID: ${RUNPOD_RECONSTRUCT_ENDPOINT_ID:-}
      RUNPOD_MICA_ENDPOINT_ID: ${RUNPOD_MICA_ENDPOINT_ID:-}
      RUNPOD_EMOCA_ENDPOINT_ID: ${RUNPOD_EMOCA_ENDPOINT_ID:-}
      MOCK_PIPELINE: ${MOCK_PIPELINE:-false}
    depends_on:
      - redis
    volumes:
      - ./backend/app:/app/app

  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      VITE_SERVER_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  redis_data:

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>splat human · animate</title>
<style>
  html, body { margin: 0; height: 100%; background: #20232a; overflow: hidden; font: 12px system-ui; color: #ccc; }
  #hud { position: fixed; left: 8px; top: 6px; white-space: pre; }
</style>
<script type="importmap">
  { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/", "@sparkjsdev/spark": "./lib/spark.module.js" } }
</script>
</head>
<body>
<div id="hud">loading…</div>
<script type="module">
// Animates a TripoSplat human with Anny's skeleton through Spark's SplatSkinning.
//
// 1. Anny is scaled, turned and placed onto the splat; its upper arms are turned to the splat's A-pose.
// 2. Every splat copies the bone weights of its nearest Anny body vertices (inverse-distance blend of
//    the 4 nearest), so the splat follows Anny's bones.
// 3. Anny has no jaw bone, only the ARKit jawOpen morph. A virtual jaw bone gets its pivot from a
//    least-squares fit of a rotation to the jawOpen deltas, and each splat's jaw weight is how far
//    jawOpen moves its nearest vertex.
// 4. Each frame the bones are posed procedurally (idle, wave, head, talk) and copied into Spark.
//
// ?splat=<file>&overlay=1 (show Anny)&anim=all|idle|wave|talk|none ; window.pose(t) freezes at time t.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SplatMesh, SparkRenderer, SplatSkinning } from '@sparkjsdev/spark';

const q = new URLSearchParams(location.search);
const hud = (s) => (document.getElementById('hud').textContent = s);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x20232a);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new SparkRenderer({ renderer, enableLod: false }));
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.02, 50);
window.shot = (yaw = 0, dist = 2.5, h = 0) => {
  const t = THREE.MathUtils.degToRad(yaw + 180); // the splat faces -z
  camera.position.set(Math.sin(t) * dist, h, Math.cos(t) * dist);
  camera.lookAt(0, h, 0);
};
window.shot(0, 2.5, 0);

const splat = new SplatMesh({ url: q.get('splat') ?? 'data/fused_v2.splat', lod: false });
splat.rotation.x = Math.PI; // TripoSplat files are y-down
scene.add(splat);
const gltf = await new GLTFLoader().loadAsync('data/anny.glb');
await splat.initialized;
const t0 = performance.now();
const anny = gltf.scene;
scene.add(anny);
let body;
const MOUTH = ['teeth_base', 'tongue01'], mouth = [];
anny.traverse((o) => {
  if (o.isSkinnedMesh && o.name === 'body') body = o;
  if (o.isMesh) {
    o.frustumCulled = false;
    if (MOUTH.includes(o.name)) return mouth.push(o); // the splat has no mouth inside: Anny lends hers
    o.visible = o.name === 'body' && q.get('overlay') === '1'; // the overlay shows the skin only
    o.material = new THREE.MeshBasicMaterial({ color: 0x55ccff, wireframe: true, transparent: true, opacity: 0.25 });
  }
});
const bones = body.skeleton.bones;
// GLTFLoader strips the dots from node names (upperarm01.L → upperarm01L)
const B = new Proxy(Object.fromEntries(bones.map((b) => [b.name, b])), { get: (o, n) => o[String(n).replace(/\./g, '')] });

// ── splat centres in world space, and the splat's solid extent ──
scene.updateMatrixWorld(true);
const N = splat.numSplats;
const pos = new Float32Array(N * 3), alpha = new Float32Array(N);
const v = new THREE.Vector3();
splat.forEachSplat((i, c, s, qq, o) => {
  v.copy(c).applyMatrix4(splat.matrixWorld);
  pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z; alpha[i] = o;
});
const solid = [];
for (let i = 0; i < N; i++) if (alpha[i] > 0.5) solid.push(i);
const pct = (arr, p) => { const s = Float32Array.from(arr).sort(); return s[Math.floor((s.length - 1) * p)]; };
const sy = solid.map((i) => pos[i * 3 + 1]), sx = solid.map((i) => pos[i * 3]), sz = solid.map((i) => pos[i * 3 + 2]);
const sTop = pct(sy, 0.998), sBot = pct(sy, 0.002), sH = sTop - sBot, sCx = pct(sx, 0.5), sCz = pct(sz, 0.5);

// ── Anny onto the splat: turn to face -z, scale to height, feet and centre on the splat's ──
anny.rotation.y = Math.PI;
anny.updateMatrixWorld(true);
const skinned = (mesh, out) => {
  const n = mesh.geometry.attributes.position.count, p = new Float32Array(n * 3), w = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    mesh.getVertexPosition(i, w); // morphs are at rest, so this is the bind position
    mesh.applyBoneTransform(i, w);
    w.applyMatrix4(mesh.matrixWorld);
    p.set([w.x, w.y, w.z], i * 3);
  }
  return p;
};
// height sets y. Width comes from the thighs and depth from a central column of the chest: in an
// A-pose the arms hang beside the waist and would inflate any band through it.
const band = (xs, ys, zs, bot, h) => {
  const tx = [], cxs = [];
  for (let i = 0; i < ys.length; i++) if (ys[i] > bot + 0.3 * h && ys[i] < bot + 0.4 * h) tx.push(xs[i]);
  const cx = (pct(tx, 0.97) + pct(tx, 0.03)) / 2;
  const cz = [];
  for (let i = 0; i < ys.length; i++) if (ys[i] > bot + 0.62 * h && ys[i] < bot + 0.72 * h && Math.abs(xs[i] - cx) < 0.06 * h) cz.push(zs[i]);
  return { w: pct(tx, 0.97) - pct(tx, 0.03), d: pct(cz, 0.97) - pct(cz, 0.03), cx, cz: (pct(cz, 0.97) + pct(cz, 0.03)) / 2 };
};
const splatBand = band(sx, sy, sz, sBot, sH);
const annyExtent = () => {
  const p = skinned(body), xs = [], ys = [], zs = [];
  for (let i = 0; i < p.length; i += 3) { xs.push(p[i]); ys.push(p[i + 1]); zs.push(p[i + 2]); }
  const bot = pct(ys, 0.001), h = pct(ys, 0.999) - bot;
  return { bot, h, ...band(xs, ys, zs, bot, h) };
};
let e = annyExtent();
const k = sH / e.h;
anny.scale.set(k * splatBand.w / (e.w * k), k, k * splatBand.d / (e.d * k));
anny.updateMatrixWorld(true);
e = annyExtent();
anny.position.set(splatBand.cx - e.cx, sBot - e.bot, splatBand.cz - e.cz);
anny.updateMatrixWorld(true);
let ap = skinned(body);

// ── upper arms to the splat's A-pose: aim shoulder→wrist at the splat's hand ──
const wp = (b) => b.getWorldPosition(new THREE.Vector3());
const aimArm = (side) => {
  const sh = B[`upperarm01.${side}`], wrist = B[`wrist.${side}`];
  const shoulder = wp(sh), sign = Math.sign(wp(wrist).x - shoulder.x);
  // splat hand: the most lateral solid splats on this side, between hip and shoulder height
  const cand = solid.filter((i) => Math.sign(pos[i * 3] - sCx) === sign && pos[i * 3 + 1] > sBot + 0.42 * sH && pos[i * 3 + 1] < shoulder.y);
  cand.sort((a, b) => Math.abs(pos[b * 3] - sCx) - Math.abs(pos[a * 3] - sCx));
  const top = cand.slice(0, Math.max(50, Math.floor(cand.length * 0.02)));
  const hand = top.reduce((acc, i) => acc.add(new THREE.Vector3(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2])), new THREE.Vector3()).divideScalar(top.length);
  const from = wp(wrist).sub(shoulder).normalize(), to = hand.clone().sub(shoulder).normalize();
  const delta = new THREE.Quaternion().setFromUnitVectors(from, to);
  const parentQ = sh.parent.getWorldQuaternion(new THREE.Quaternion());
  const worldQ = sh.getWorldQuaternion(new THREE.Quaternion());
  sh.quaternion.copy(parentQ.clone().invert().multiply(delta.multiply(worldQ)));
  sh.updateMatrixWorld(true);
  return THREE.MathUtils.radToDeg(from.angleTo(to)).toFixed(1);
};
const armFix = { L: aimArm('L'), R: aimArm('R') };
anny.updateMatrixWorld(true);
ap = skinned(body);

// ── jaw: fit a rotation about the head's x axis to the jawOpen deltas (world space) ──
const jawIdx = body.morphTargetDictionary.jawOpen;
const jd = body.geometry.morphAttributes.position[jawIdx];
const nv = ap.length / 3, jawMag = new Float32Array(nv);
// the hinge is the world x axis: Anny's head bone is not quite level, and its own x axis tilted the jaw
const axis = new THREE.Vector3(1, 0, 0);
const toWorldDir = new THREE.Matrix3().setFromMatrix4(body.matrixWorld);
let maxMag = 0;
const dW = [];
for (let i = 0; i < nv; i++) {
  const d = new THREE.Vector3().fromBufferAttribute(jd, i).applyMatrix3(toWorldDir);
  dW.push(d); jawMag[i] = d.length(); maxMag = Math.max(maxMag, jawMag[i]);
}
// in the plane normal to the axis: d ≈ θ · axis × (p − c)  →  linear least squares in (θ, θc)
const e1 = new THREE.Vector3().crossVectors(axis, new THREE.Vector3(0, 0, 1)).normalize(); // ~ up
const e2 = new THREE.Vector3().crossVectors(axis, e1).normalize();
let A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], rhs = [0, 0, 0];
const addRow = (row, y) => { for (let r = 0; r < 3; r++) { rhs[r] += row[r] * y; for (let c = 0; c < 3; c++) A[r][c] += row[r] * row[c]; } };
for (let i = 0; i < nv; i++) {
  if (jawMag[i] < 0.4 * maxMag) continue;
  const p = new THREE.Vector3(ap[i * 3], ap[i * 3 + 1], ap[i * 3 + 2]);
  const pu = p.dot(e1), pv = p.dot(e2), du = dW[i].dot(e1), dv = dW[i].dot(e2);
  // axis × (p−c) in (e1, e2) coords = (−(pv−cv), (pu−cu)) with e2 = axis × e1
  addRow([-pv, 1, 0], du); // du = −θ pv + θ cv
  addRow([pu, 0, -1], dv); // dv =  θ pu − θ cu
}
const solve3 = (M, b) => { // Cramer's rule
  const det = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det(M);
  return [0, 1, 2].map((c) => det(M.map((r, i) => r.map((x, j) => (j === c ? b[i] : x)))) / D);
};
const [theta, tcv, tcu] = solve3(A, rhs);
const cu = tcu / theta, cv = tcv / theta;
const headPos = wp(B.head);
const axisPt = headPos.clone().sub(e1.clone().multiplyScalar(headPos.dot(e1) - cu)).sub(e2.clone().multiplyScalar(headPos.dot(e2) - cv));
const jawPivot = axisPt; // a point on the hinge axis, level with the head bone along the axis

// ── bind: inverse-distance blend of the 4 nearest Anny vertices, through a uniform grid ──
const cell = sH / 120, grid = new Map(), key = (x, y, z) => ((x + 1024) * 2048 + (y + 1024)) * 2048 + (z + 1024);
for (let i = 0; i < nv; i++) {
  const g = key(Math.floor(ap[i * 3] / cell), Math.floor(ap[i * 3 + 1] / cell), Math.floor(ap[i * 3 + 2] / cell));
  (grid.get(g) ?? grid.set(g, []).get(g)).push(i);
}
const sIdx = body.geometry.attributes.skinIndex, sW = body.geometry.attributes.skinWeight;
const JAW = bones.length; // the virtual jaw bone index
const skin = new SplatSkinning({ mesh: splat, numBones: bones.length + 1 });
const near = [], bi = new THREE.Vector4(), bw = new THREE.Vector4();
let farthest = 0;
for (let s = 0; s < N; s++) {
  const x = pos[s * 3], y = pos[s * 3 + 1], z = pos[s * 3 + 2];
  const cx = Math.floor(x / cell), cy = Math.floor(y / cell), cz = Math.floor(z / cell);
  near.length = 0;
  for (let r = 1; r < 40 && near.length < 4; r = r < 3 ? r + 1 : r * 2) {
    near.length = 0;
    for (let i = -r; i <= r; i++) for (let j = -r; j <= r; j++) for (let l = -r; l <= r; l++) {
      const list = grid.get(key(cx + i, cy + j, cz + l));
      if (list) for (let t = 0; t < list.length; t++) near.push(list[t]);
    }
  }
  const scored = near.map((vi) => [vi, (ap[vi * 3] - x) ** 2 + (ap[vi * 3 + 1] - y) ** 2 + (ap[vi * 3 + 2] - z) ** 2]).sort((a, b) => a[1] - b[1]).slice(0, 4);
  farthest = Math.max(farthest, Math.sqrt(scored[0][1]));
  const acc = new Map();
  let jaw = 0, wsum = 0;
  for (const [vi, d2] of scored) {
    const w = 1 / (Math.sqrt(d2) + cell * 0.25);
    wsum += w;
    jaw += w * (jawMag[vi] / maxMag);
    for (let c = 0; c < 4; c++) {
      const b = sIdx.getComponent(vi, c), ww = sW.getComponent(vi, c);
      if (ww > 0) acc.set(b, (acc.get(b) ?? 0) + w * ww);
    }
  }
  jaw = Math.min(1, jaw / wsum);
  jaw = THREE.MathUtils.smoothstep(jaw, 0.42, 0.5); // a near-binary lip line: blended weights smear the lips
  const top = [...acc.entries()].sort((a, b) => b[1] - a[1]).slice(0, jaw > 0.02 ? 3 : 4);
  const tot = top.reduce((a, e) => a + e[1], 0);
  const ids = top.map((e) => e[0]), ws = top.map((e) => (e[1] / tot) * (1 - jaw));
  if (jaw > 0.02) { ids.push(JAW); ws.push(jaw); }
  while (ids.length < 4) { ids.push(0); ws.push(0); }
  skin.setSplatBones(s, bi.set(...ids), bw.set(...ws));
}
skin.skinTexture.needsUpdate = true;

// ── bones into splat object space each frame ──
// Spark's shader applies p' = R·p + t, but its setBoneQuatPos builds R = rest⁻¹·q and t = pos − restPos,
// which is only right for bones that turn about the origin. So rest stays the identity and each bone
// gets its full skinning transform T = O⁻¹ · M_now · M_rest⁻¹ · O (O = splat object to world).
const O = splat.matrixWorld.clone(), Oinv = O.clone().invert();
const restInv = bones.map((b) => b.matrixWorld.clone().invert());
const m = new THREE.Matrix4(), qq = new THREE.Quaternion(), pp = new THREE.Vector3(), sc = new THREE.Vector3();
const ID_Q = new THREE.Quaternion(), ZERO = new THREE.Vector3();
const setSkin = (i, worldDelta) => {
  m.multiplyMatrices(Oinv, worldDelta).multiply(O).decompose(pp, qq, sc);
  skin.setBoneQuatPos(i, qq, pp);
};
for (let i = 0; i <= bones.length; i++) skin.setRestQuatPos(i, ID_Q, ZERO);
const headRestInv = restInv[bones.indexOf(B.head)];
splat.skinning = skin;
splat.updateGenerator();
// skinned meshes keep bind-space geometry, so the teeth box has to come from the posed vertices
const tp = skinned(mouth.find((mm) => mm.name === 'teeth_base')), teethBox = new THREE.Box3();
for (let i = 0; i < tp.length; i += 3) teethBox.expandByPoint(new THREE.Vector3(tp[i], tp[i + 1], tp[i + 2]));
const cavity = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshBasicMaterial({ color: 0x1c0b0b }));
const tSize = teethBox.getSize(new THREE.Vector3()), tCentre = teethBox.getCenter(new THREE.Vector3());
tCentre.z += tSize.z * 0.25; // a little behind the front teeth (the face looks at -z)
const cavityRest = new THREE.Matrix4().compose(tCentre, new THREE.Quaternion(), tSize.clone().multiply(new THREE.Vector3(0.42, 0.42, 0.45)));
window.mouthDebug = { teethCentre: tCentre.toArray().map((x) => +x.toFixed(3)), teethSize: tSize.toArray().map((x) => +x.toFixed(3)) };
cavity.matrixAutoUpdate = false;
scene.add(cavity);
const withMouth = q.get('mouth') === '1'; // Anny's teeth and a dark cavity behind the lips (still misplaced)
cavity.visible = withMouth;
for (const mm of mouth) mm.visible = withMouth;
const rest = new Map(bones.map((b) => [b, b.quaternion.clone()]));

// ── procedural animation on Anny's bones ──
const anim = q.get('anim') ?? 'all';
const rot = (b, x, y, z) => b.quaternion.copy(rest.get(b)).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z)));
let jawOpen = 0;
const drive = (t) => {
  bones.forEach((b) => b.quaternion.copy(rest.get(b)));
  const on = (name) => anim === 'all' || anim === name;
  if (on('idle')) {
    rot(B.spine03, Math.sin(t * 1.6) * 0.02, Math.sin(t * 0.5) * 0.04, 0);
    rot(B.neck02, 0, Math.sin(t * 0.7) * 0.35, Math.sin(t * 0.45) * 0.06);
  }
  if (on('wave')) {
    const up = 0.5 + 0.5 * Math.sin(t * 0.9 - 1.2);
    rot(B['upperarm01.R'], 0, 0, -1.1 * up);
    const el = (q.get('elbow') ?? 'x+').split('');  // elbow axis and sign, to try the bone's local frame
    const a = (el[1] === '-' ? -1.3 : 1.3) * up;
    rot(B['lowerarm01.R'], el[0] === 'x' ? a : 0, el[0] === 'y' ? a : 0, el[0] === 'z' ? a : 0);
    rot(B['lowerarm02.R'], 0, Math.sin(t * 7) * 0.5 * up, 0);
  }
  jawOpen = on('talk') ? Math.max(0, Math.sin(t * 9) * 0.5 + 0.5) * (0.6 + 0.4 * Math.sin(t * 2.3)) : 0;
  anny.updateMatrixWorld(true);
  bones.forEach((b, i) => setSkin(i, new THREE.Matrix4().multiplyMatrices(b.matrixWorld, restInv[i])));
  // jaw = open about the fitted hinge (rest pose), then follow the head
  const hinge = new THREE.Matrix4().makeTranslation(jawPivot.x, jawPivot.y, jawPivot.z)
    .multiply(new THREE.Matrix4().makeRotationAxis(axis, theta * jawOpen))
    .multiply(new THREE.Matrix4().makeTranslation(-jawPivot.x, -jawPivot.y, -jawPivot.z));
  const headDelta = new THREE.Matrix4().multiplyMatrices(B.head.matrixWorld, headRestInv);
  setSkin(JAW, headDelta.clone().multiply(hinge));
  cavity.matrix.multiplyMatrices(headDelta, cavityRest);
  for (const mm of mouth) if (mm.morphTargetDictionary?.jawOpen !== undefined) mm.morphTargetInfluences[mm.morphTargetDictionary.jawOpen] = jawOpen;
  skin.updateBones();
};
window.pose = (t) => { window.frozen = true; drive(t); renderer.render(scene, camera); };
window.ready = {
  splats: N, annyScale: +k.toFixed(4), armFixDeg: armFix, bindMs: Math.round(performance.now() - t0),
  farthestSplatToAnny: +farthest.toFixed(3), splatHeight: +sH.toFixed(3),
  jaw: { thetaDeg: +THREE.MathUtils.radToDeg(theta).toFixed(1), pivot: jawPivot.toArray().map((x) => +x.toFixed(3)) },
};
hud(JSON.stringify(window.ready, null, 1));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { if (!window.frozen) drive(clock.getElapsedTime()); renderer.render(scene, camera); });
</script>
</body>
</html>

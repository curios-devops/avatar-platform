name: Build & Push meya-livetalking

on:
  push:
    branches: [main, feat/livetalking-image]
    paths:
      - 'docker/livetalking/**'
      - 'docker/livetalking.Dockerfile'
      - '.github/workflows/build-livetalking.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/livetalking.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            devopsavatar/meya-livetalking:latest
            devopsavatar/meya-livetalking:${{ github.sha }}

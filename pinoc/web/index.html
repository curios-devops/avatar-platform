<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PINOC · personaje 3DGS animado (PoC)</title>
<style>
  html, body { margin: 0; height: 100%; background: #d9d6cf; font: 13px system-ui; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 10px; top: 10px; width: 300px; background: #fffc; border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
  #ui select, #ui button { font: inherit; width: 100%; }
  #ui .row { display: flex; gap: 6px; }
  #stats { white-space: pre; font: 11px ui-monospace, monospace; color: #333; }
  #err { white-space: pre-wrap; font: 11px ui-monospace, monospace; color: #a00; max-height: 30vh; overflow: auto; }
  label { color: #555; }
</style>
<script type="importmap">{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "three/webgpu": "/node_modules/three/build/three.webgpu.js",
  "three/tsl": "/node_modules/three/build/three.tsl.js",
  "@viggle/splat-engine-three": "/node_modules/@viggle/splat-engine-three/dist/index.js",
  "@viggle/splat-engine-three/webgpu": "/node_modules/@viggle/splat-engine-three/dist/webgpu.js",
  "zstddec": "/node_modules/zstddec/dist/zstddec.mjs"
} }</script>
</head>
<body>
<div id="ui">
  <b>PINOC → three.js (Viggle Splat Engine)</b>
  <div id="auth">comprobando acceso…</div>
  <label>Personaje</label><select id="char"></select>
  <label>Clip de reposo</label><select id="idle"></select>
  <label>Clip de movimiento</label><select id="move"></select>
  <button id="load">Cargar</button>
  <div class="row"><button id="bIdle">Reposo</button><button id="bMove">Movimiento</button><button id="bStop">Pose base</button></div>
  <label>Cabeza (giro, en tiempo real) <span id="yawv">0°</span></label><input id="yaw" type="range" min="-40" max="40" value="0">
  <div id="stats"></div>
  <div id="err"></div>
</div>
<script type="module">
// Rendering only. Assets come from the broker (server.py) through /api/* and /assets/*; this page holds
// no credential and never calls Viggle itself. URL params make a run reproducible:
//   ?char=char_… | local:file.vsplat  &idle=mot_… | local:file.glb  &move=…  &rig=metahuman  &backend=webgl|webgpu  &auto=1
import * as THREE from 'three';

const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const errors = [];
const fail = (stage, e) => {
  const msg = `[${stage}] ${e?.message ?? e}`;
  errors.push(msg); $('err').textContent = errors.join('\n'); console.error(msg, e);
  window.state.errors = errors;
};
window.state = { errors, stage: 'init' };
const api = async (path) => {
  const r = await fetch(path);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${path} → HTTP ${r.status} ${body.error?.code ?? ''}: ${body.error?.message ?? ''}`);
  return body;
};

// ── renderer: WebGL by default, WebGPU on request (and only if it really runs on WebGPU) ──
const backend = q.get('backend') ?? 'webgl';
const lib = backend === 'webgpu' ? await import('@viggle/splat-engine-three/webgpu') : await import('@viggle/splat-engine-three');
let renderer;
if (backend === 'webgpu') {
  const { WebGPURenderer } = await import('three/webgpu');
  renderer = new WebGPURenderer({ antialias: false });
  await renderer.init();
  if (renderer.backend.isWebGPUBackend !== true) { fail('renderer', 'WebGPU no disponible: usa ?backend=webgl'); }
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // splats blend in sRGB, as the README advises
} else {
  renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d6cf);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshBasicMaterial({ color: 0xc9c5bc }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50);
// frame a standing figure of height h (feet at y=0), a little off-axis so it reads as 3D
const frameTo = (h, zoom = 1) => {
  const d = (h * 0.62) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / zoom, yaw = THREE.MathUtils.degToRad(+(q.get('yaw') ?? 20));
  camera.position.set(d * Math.sin(yaw), h * 0.55, d * Math.cos(yaw)); camera.lookAt(0, h * 0.5, 0);
};
frameTo(1.75);
lib.SplatEngine.shared.camera = camera;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ── asset menus: account assets from the API, plus local files (e.g. fetched through the MCP) ──
const rig = q.get('rig') ?? 'metahuman';
const urlFor = (kind, v) => v.startsWith('local:') ? `/assets/${encodeURIComponent(v.slice(6))}`
  : kind === 'char' ? `/api/characters/${v}/vsplat` : `/api/motions/${v}/glb?rig=${rig}`;
async function menus() {
  const status = await api('/api/status');
  window.state.auth = status;
  $('auth').textContent = status.key === 'valid' ? `API Viggle: clave válida · créditos ${status.credits?.balance}`
    : status.key === 'missing' ? 'API Viggle: falta VIGLE_K_API_KEY (solo assets locales)'
    : `API Viggle: clave rechazada (${status.error?.code})`;
  if (status.key === 'rejected') fail('auth', `${status.error?.code}: ${status.error?.message}`);
  const local = (await api('/api/local')).data;
  let chars = [], motions = [];
  if (status.key === 'valid') {
    try { chars = (await api('/api/characters')).data; } catch (e) { fail('list characters', e); }
    try { motions = (await api('/api/motions')).data; } catch (e) { fail('list motions', e); }
  }
  window.state.assets = { characters: chars.map(({ id, name, status, type, vsplat }) => ({ id, name, status, type, vsplat })),
    motions: motions.map(({ id, name, status, type, glb }) => ({ id, name, status, type, glb: glb?.status })), local };
  const fill = (sel, items) => { sel.innerHTML = items.map(([v, t]) => `<option value="${v}">${t}</option>`).join(''); };
  fill($('char'), [...chars.filter((c) => c.vsplat?.status === 'ready').map((c) => [c.id, `${c.name || c.id} (API)`]),
    ...local.filter((f) => /\.(vsplat|bin)$/.test(f)).map((f) => [`local:${f}`, `${f} (local)`])]);
  const clipItems = [...motions.filter((m) => m.glb?.status === 'ready').map((m) => [m.id, `${m.name || m.id} (API)`]),
    ...local.filter((f) => f.endsWith('.glb')).map((f) => [`local:${f}`, `${f} (local)`])];
  fill($('idle'), clipItems); fill($('move'), clipItems);
  for (const k of ['char', 'idle', 'move']) if (q.get(k)) $(k).value = q.get(k);
  if (!$('char').options.length) fail('assets', 'no hay ningún personaje con vsplat listo (ni en la API ni en pinoc/assets/)');
}

// ── dark palms ──
// PINOC fills what the source photo never showed (palms pressed to the thighs) with dark splats, which shows
// as soon as a clip turns the hands. Splat colour is baked (no SH on characters), so the fix is a colour hook:
// splats near each hand that are much darker than the forearm are pulled towards the forearm's own skin tone,
// sampled from the frame. Hand anchors are taken at bind, in model space, the space of the hook's restCenter.
// ?palmfix=0 turns it off. Vec3 uniforms did not reach the hook in 0.3.0, so the values go in as constants.
function handAnchors(c) {
  c.updateMatrixWorld();
  const inv = c.matrixWorld.clone().invert();
  const at = (n) => { const m = c.getBoneWorldMatrix(n); if (!m) return null; const e = m.data ?? m.elements; return new THREE.Vector3(e[12], e[13], e[14]).applyMatrix4(inv); };
  const out = [];
  for (const s of ['l', 'r']) {
    const wrist = at(`hand_${s}`), knuckle = at(`middle_01_${s}`);
    if (wrist && knuckle) out.push(wrist.lerp(knuckle, 0.8));
  }
  return out.length === 2 ? out : null;
}
function skinTone(c) {
  renderer.render(scene, camera);
  const cv = renderer.domElement, g = Object.assign(document.createElement('canvas'), { width: cv.width, height: cv.height }).getContext('2d', { willReadFrequently: true });
  g.drawImage(cv, 0, 0);
  const at = (n) => { const m = c.getBoneWorldMatrix(n); const e = m.data ?? m.elements; return new THREE.Vector3(e[12], e[13], e[14]); };
  const px = [];
  for (const s of ['l', 'r']) {
    const p = at(`lowerarm_${s}`).lerp(at(`hand_${s}`), 0.6).project(camera);
    const x = Math.round((p.x + 1) / 2 * cv.width), y = Math.round((1 - p.y) / 2 * cv.height), d = g.getImageData(x - 3, y - 3, 7, 7).data;
    for (let i = 0; i < d.length; i += 4) px.push([d[i] / 255, d[i + 1] / 255, d[i + 2] / 255]);
  }
  const med = [0, 1, 2].map((k) => px.map((p) => p[k]).sort((a, b) => a - b)[px.length >> 1]);
  const skinLike = med[0] > med[1] + 0.03 && med[1] > med[2] && med[0] > 0.35; // not a sleeve or the background
  window.state.skinSample = med.map((v) => +v.toFixed(3));
  return skinLike ? med : null;
}
async function fixPalms(c, anchors) {
  await new Promise((r) => setTimeout(r, 600)); // the first frames draw before the splats are sorted
  const skin = skinTone(c);
  window.state.palmFix = skin ? { skin: skin.map((v) => +v.toFixed(3)) } : 'skipped (forearm is not skin)';
  if (!skin) return;
  const v3 = (v) => `vec3(${v.map((x) => x.toFixed(4)).join(', ')})`;
  c.setColorModifier({ uniforms: {}, glsl: `void modifySplatColor(vec3 center, vec3 modelCenter, vec3 restCenter, uint splatIndex, inout vec4 color) {
    const vec3 HL = ${v3(anchors[0].toArray())}; const vec3 HR = ${v3(anchors[1].toArray())}; const vec3 SKIN = ${v3(skin)};
    float near = 1.0 - smoothstep(0.084, 0.14, min(distance(restCenter, HL), distance(restCenter, HR)));
    float rel = dot(color.rgb, vec3(0.299, 0.587, 0.114)) / dot(SKIN, vec3(0.299, 0.587, 0.114));
    color.rgb = mix(color.rgb, SKIN * mix(0.8, 1.0, clamp(rel, 0.0, 1.0)), near * smoothstep(0.8, 0.45, rel));
  }` });
}

// ── load and play ──
let character = null, clips = {}, yawDeg = 0, frames = 0, fps = 0, lastFps = performance.now();
async function load() {
  window.state.stage = 'loading';
  try {
    character?.removeFromParent(); character?.dispose(); character = null;
    const t0 = performance.now();
    character = await new lib.VSplatLoader().loadAsync(urlFor('char', $('char').value));
    const tChar = performance.now() - t0;
    scene.add(character);
    const loader = new lib.SplatClipLoader();
    const t1 = performance.now();
    clips = { idle: await loader.loadAsync(urlFor('clip', $('idle').value)) };
    clips.move = $('move').value === $('idle').value ? clips.idle : await loader.loadAsync(urlFor('clip', $('move').value));
    const tClips = performance.now() - t1;
    // real-time head control on top of whatever clip plays (the engine's documented PoseModifier hook)
    const names = character.boneNames, head = names.indexOf('head');
    const turn = new lib.Quat();
    character.armature.poseModifier = head < 0 ? null : (pose) => {
      if (!yawDeg) return;
      turn.setFromEulerAngles(0, 0, yawDeg); // MetaHuman head bone: local x forward, y sideways, z down → yaw is about z
      pose.rotations[head].mul(turn);
    };
    // the engine's default root pinning leaves PINOC characters facing -Z; turn them to the camera
    if (q.get('flip') !== '0') character.rotation.y = Math.PI;
    character.update(0);
    const anchors = q.get('palmfix') === '0' || backend !== 'webgl' ? null : handAnchors(character);
    character.play(clips.idle, { loop: true }); character.update(0);
    const headM = character.getBoneWorldMatrix('head'), headY = headM ? new THREE.Vector3().setFromMatrixPosition(new THREE.Matrix4().fromArray(headM.data ?? headM.elements)).y : 1.6;
    frameTo(headY + 0.15, +(q.get('zoom') ?? 1));
    if (anchors) fixPalms(character, anchors);
    const splats = character.splats.reduce((a, s) => a + (s.numSplats ?? 0), 0);
    window.state = { ...window.state, stage: 'ready', loadMs: { character: Math.round(tChar), clips: Math.round(tClips) },
      bones: names.length, headBone: head, facialBones: names.filter((n) => n.startsWith('FACIAL_')).length, splats,
      clipDur: { idle: clips.idle.duration ?? null, move: clips.move.duration ?? null }, backend, height: +(headY + 0.15).toFixed(2) };
    window.state.playing = 'idle';
  } catch (e) { fail('load', e); window.state.stage = 'failed'; }
}
const toIdle = () => { if (!character) return; character.crossFadeTo(clips.idle, 0.35); window.state.playing = 'idle'; };
const toMove = () => { if (!character) return; character.crossFadeTo(clips.move, 0.35); window.state.playing = 'move'; };
$('load').onclick = load; $('bIdle').onclick = toIdle; $('bMove').onclick = toMove;
$('bStop').onclick = () => { character?.stop(0.3); window.state.playing = 'rest'; };
$('yaw').oninput = (e) => { yawDeg = +e.target.value; $('yawv').textContent = `${yawDeg}°`; };
window.demo = { load, toIdle, toMove, setYaw: (d) => { yawDeg = d; }, get character() { return character; }, camera, renderer, scene };

try { await menus(); } catch (e) { fail('menus', e); }
if (q.get('auto') === '1' && $('char').options.length) await load();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  try { character?.update(dt); } catch (e) { fail('update', e); renderer.setAnimationLoop(null); }
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - lastFps > 1000) {
    fps = (frames * 1000) / (now - lastFps); frames = 0; lastFps = now; window.state.fps = +fps.toFixed(1);
    const s = window.state;
    $('stats').textContent = `backend ${backend} · ${fps.toFixed(0)} fps\n` + (s.stage === 'ready'
      ? `splats ${s.splats} · huesos ${s.bones} (faciales ${s.facialBones})\ncarga personaje ${s.loadMs.character} ms · clips ${s.loadMs.clips} ms\nreproduciendo: ${s.playing}` : s.stage);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Híbrido: cuerpo splat de PINOC + cara Twin (three.js)</title>
<style>html, body { margin: 0; height: 100%; background: #d9d6cf; overflow: hidden; font: 12px system-ui; } #hud { position: fixed; left: 8px; top: 6px; white-space: pre; color: #333; }</style>
<script type="importmap">{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@viggle/splat-engine-three": "/node_modules/@viggle/splat-engine-three/dist/index.js",
  "zstddec": "/node_modules/zstddec/dist/zstddec.mjs"
} }</script>
</head>
<body>
<div id="hud">cargando…</div>
<script type="module">
// Option 3 of the PINOC PoC: the splat body (and its hair and ears) from PINOC, the face from our Twin
// (an Anny mesh with the photo projected on it and 51 ARKit morphs), so the mouth can really open.
// The Twin face is cut to the front of the head, scaled and placed by the two eyes, and follows the
// splat's head bone every frame; the splat's own face is hidden with a colour hook on its rest positions.
//   ?char=asian_woman_high.vsplat  ?clip=standing_idle.glb  ?talk=1 (synthetic visemes + blinks)
//   ?hide=0 (keep the splat face)  ?twin=0 (splat only)  ?dz=0 ?dy=0 ?sc=1 (fit nudges, metres / ratio)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VSplatLoader, SplatClipLoader } from '@viggle/splat-engine-three';

const q = new URLSearchParams(location.search);
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d6cf);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a898, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(0.5, 2.5, 2); scene.add(key);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.02, 50);
const state = (window.state = { errors: [] });
const fail = (e) => { state.errors.push(String(e?.message ?? e)); document.getElementById('hud').textContent = state.errors.join('\n'); console.error(e); };

const V = () => new THREE.Vector3();
const posOf = (m) => V().setFromMatrixPosition(m);
const boneM = (c, name) => { const m = c.getBoneWorldMatrix(name); return m ? new THREE.Matrix4().fromArray(m.elements ?? m.data) : null; };

try {
  // ── splat body ──
  const character = await new VSplatLoader().loadAsync(`/assets/${q.get('char') ?? 'asian_woman_high.vsplat'}`);
  character.rotation.y = Math.PI; // PINOC characters face -Z under the loaders' default
  scene.add(character); character.updateMatrixWorld(true);
  const clip = await new SplatClipLoader().loadAsync(`/assets/${q.get('clip') ?? 'standing_idle.glb'}`);

  // rest (bind) pose: where the face sits in the splat's own model space, for the hiding hook
  character.stop(0); character.update(0); character.updateMatrixWorld(true);
  const toModel = character.matrixWorld.clone().invert();
  const headB = posOf(boneM(character, 'head')), eLb = posOf(boneM(character, 'FACIAL_L_Eye')), eRb = posOf(boneM(character, 'FACIAL_R_Eye'));
  const midB = eLb.clone().add(eRb).multiplyScalar(0.5), iodB = eLb.distanceTo(eRb);
  const fwdB = midB.clone().sub(headB).setY(0).normalize();
  // the face region, in units of the eye distance so one rule fits both heads. `inside` is how deep a
  // point sits in it (negative outside); across a band of `fade` the splat fades out as the Twin fades in
  const region = { radius: 2.6, back: num('back', 0.15), top: num('top', 1.1), bottom: num('bottom', -2.3), fade: num('fade', 0.35) };
  if (q.get('hide') !== '0' && q.get('twin') !== '0') {
    const m = (p) => p.clone().applyMatrix4(toModel);
    const u = { uHead: { value: m(headB) }, uMid: { value: m(midB) },
      uFwd: { value: fwdB.clone().transformDirection(toModel) }, uIod: { value: iodB },
      uReg: { value: new THREE.Vector4(region.radius, region.back, region.top, region.bottom) }, uFade: { value: region.fade } };
    character.setColorModifier({ uniforms: u, glsl: `
      void modifySplatColor(vec3 center, vec3 modelCenter, vec3 restCenter, uint splatIndex, inout vec4 color) {
        float r = length(restCenter - uHead) / uIod, f = dot(restCenter - uHead, uFwd) / uIod, h = (restCenter.y - uMid.y) / uIod;
        float inside = min(min(uReg.x - r, f - uReg.y), min(uReg.z - h, h - uReg.w));
        color.a *= 1.0 - smoothstep(-uFade, 0.0, inside);
      }` });
  }

  // ── Twin face ──
  let twin = null, morphMeshes = [], offset = null;
  if (q.get('twin') !== '0') {
    const gltf = await new GLTFLoader().loadAsync('/assets/twin.glb');
    twin = gltf.scene; twin.updateMatrixWorld(true);
    const tl = new THREE.TextureLoader();
    const tex = async (f, srgb = true) => { const t = await tl.loadAsync(`/assets/${f}`); t.flipY = false; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
    const [face, eye, teeth, tongue, brow, lash] = await Promise.all(['twin_face_2k.jpg', 'twin_eye.jpg', 'twin_teeth.png',
      'twin_tongue01_diffuse.png', 'twin_eyebrow001.png', 'twin_eyelashes01.png'].map((f) => tex(f)));
    const meshes = {};
    twin.traverse((o) => { if (o.isSkinnedMesh) meshes[o.name] = o; });
    const std = (map, extra = {}) => new THREE.MeshStandardMaterial({ map, roughness: 0.6, ...extra });
    // the splat's light is baked into its colours; the Twin is lit, so part of its texture is emitted to
    // sit closer to that look, and a tint (?tint=r,g,b) matches the skin tone
    const tint = new THREE.Color(...(q.get('tint') ?? '1.08,1.0,0.97').split(',').map(Number));
    meshes.body.material = std(face, { roughness: 0.6, color: tint, emissive: tint.clone().multiplyScalar(num('em', 0.35)),
      emissiveMap: face, vertexColors: true, alphaHash: true });
    meshes['high-poly'].material = std(eye, { roughness: 0.08, alphaTest: 0.35, alphaToCoverage: true, side: THREE.DoubleSide });
    meshes.teeth_base.material = std(teeth, { roughness: 0.35 });
    meshes.tongue01.material = std(tongue, { roughness: 0.5 });
    for (const [n, t] of [['eyebrow001', brow], ['eyelashes01', lash]])
      meshes[n].material = std(t, { transparent: true, alphaTest: 0.25, side: THREE.DoubleSide, depthWrite: false });
    morphMeshes = Object.values(meshes).filter((m) => m.morphTargetDictionary);

    // the Twin's own eyes and head, in its bind pose (GLB positions are already in that space)
    const eyePos = meshes['high-poly'].geometry.attributes.position, L = V(), R = V(); let nl = 0, nr = 0;
    for (let i = 0; i < eyePos.count; i++) { const x = eyePos.getX(i); (x > 0 ? L : R).add(V().fromBufferAttribute(eyePos, i)); x > 0 ? nl++ : nr++; }
    L.divideScalar(nl); R.divideScalar(nr);
    const skel = meshes.body.skeleton, hi = skel.bones.findIndex((b) => b.name === 'head');
    const headT = posOf(skel.bones[hi].matrixWorld), midT = L.clone().add(R).multiplyScalar(0.5), iodT = L.distanceTo(R);
    const fwdT = midT.clone().sub(headT).setY(0).normalize();

    // keep only the face of the body mesh: the same region as the hidden splats, on head-weighted vertices
    const g = meshes.body.geometry, P = g.attributes.position, SI = g.attributes.skinIndex, SW = g.attributes.skinWeight, idx = g.index.array, keep = [];
    // how deep each vertex sits in the face region (same rule as the splats), as an alpha in a vertex colour
    const depth = (i) => {
      const p = V().fromBufferAttribute(P, i), r = p.distanceTo(headT) / iodT, f = p.clone().sub(headT).dot(fwdT) / iodT, h = (p.y - midT.y) / iodT;
      return Math.min(region.radius - r, f - region.back, region.top - h, h - region.bottom);
    };
    const ok = new Uint8Array(P.count), col = new Float32Array(P.count * 4);
    for (let i = 0; i < P.count; i++) {
      let w = 0; for (let k = 0; k < 4; k++) if (SI.getComponent(i, k) === hi) w += SW.getComponent(i, k);
      const d = depth(i), a = THREE.MathUtils.smoothstep(d, -region.fade, 0);
      ok[i] = w > 0.3 && d > -region.fade ? 1 : 0;
      col.set([1, 1, 1, a], i * 4);
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 4));
    for (let t = 0; t < idx.length; t += 3) if (ok[idx[t]] && ok[idx[t + 1]] && ok[idx[t + 2]]) keep.push(idx[t], idx[t + 1], idx[t + 2]);
    g.setIndex(keep);
    state.faceTris = keep.length / 3;

    // place it: eyes on eyes, the eye line along the eye line, then follow the splat head bone
    const frame = (l, r, up = new THREE.Vector3(0, 1, 0)) => {
      const x = r.clone().sub(l).normalize(), z = new THREE.Vector3().crossVectors(x, up).normalize(), y = new THREE.Vector3().crossVectors(z, x);
      return new THREE.Matrix4().makeBasis(x, y, z);
    };
    const s = (iodB / iodT) * num('sc', 1);
    const rot = frame(eLb, eRb).multiply(frame(L, R).transpose());
    const target = midB.clone().addScaledVector(fwdB, num('dz', 0)).add(new THREE.Vector3(0, num('dy', 0), 0));
    const place = new THREE.Matrix4().makeTranslation(target.x, target.y, target.z).multiply(rot)
      .multiply(new THREE.Matrix4().makeScale(s, s, s)).multiply(new THREE.Matrix4().makeTranslation(-midT.x, -midT.y, -midT.z));
    offset = boneM(character, 'head').invert().multiply(place);
    twin.matrixAutoUpdate = false;
    scene.add(twin);
    Object.assign(state, { iodSplat: +iodB.toFixed(4), iodTwin: +iodT.toFixed(4), scale: +s.toFixed(3) });
  }

  // ── camera: a portrait framing of the face, or the whole figure with ?full=1 ──
  character.play(clip, { loop: true }); character.update(0);
  const hp = posOf(boneM(character, 'head'));
  // the bind pose faces another way than the clips (root pinned to bind), so aim from the playing pose
  const eyesNow = posOf(boneM(character, 'FACIAL_L_Eye')).add(posOf(boneM(character, 'FACIAL_R_Eye'))).multiplyScalar(0.5);
  const fwdNow = eyesNow.sub(hp).setY(0).normalize();
  const dist = q.get('full') === '1' ? 3.8 : num('dist', 0.9), yaw = THREE.MathUtils.degToRad(num('yaw', 0));
  const look = q.get('full') === '1' ? new THREE.Vector3(0, 0.95, 0) : hp.clone().add(new THREE.Vector3(0, -0.05, 0));
  const dir = fwdNow.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  camera.position.copy(look).addScaledVector(dir, dist); camera.lookAt(look);

  // ── synthetic speech: jaw and lip shapes on a syllable rhythm, blinks every few seconds ──
  const talk = q.get('talk') !== '0';
  const setMorph = (name, v) => { for (const m of morphMeshes) { const i = m.morphTargetDictionary[name]; if (i !== undefined) m.morphTargetInfluences[i] = v; } };
  const speak = (t) => {
    const syl = Math.max(0, Math.sin(t * 2 * Math.PI * 3.1)) * (0.55 + 0.45 * Math.sin(t * 1.7));
    setMorph('jawOpen', talk ? 0.45 * syl : 0);
    setMorph('mouthFunnel', talk ? 0.35 * Math.max(0, Math.sin(t * 2.3 + 1)) * syl : 0);
    setMorph('mouthSmileLeft', 0.12); setMorph('mouthSmileRight', 0.12);
    const b = (t % 3.4) < 0.14 ? 1 : 0; setMorph('eyeBlinkLeft', b); setMorph('eyeBlinkRight', b);
  };
  window.pose = (t) => { window.frozen = true; character.time = t % clip.duration; character.update(0); speak(t); sync(); renderer.render(scene, camera); };
  const sync = () => { if (twin) { twin.matrix.copy(boneM(character, 'head').multiply(offset)); twin.matrixWorldNeedsUpdate = true; } };

  window.dbg = { camera, character, twin, scene, renderer, headB, midB, fwdB, look };
  state.ready = true;
  document.getElementById('hud').textContent = JSON.stringify(state);
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (!window.frozen) { character.update(dt); speak(clock.elapsedTime); sync(); }
    renderer.render(scene, camera);
  });
} catch (e) { fail(e); }
</script>
</body>
</html>
